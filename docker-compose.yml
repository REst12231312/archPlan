services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      ARCHPLAN_DB_PATH: /var/lib/archplan/archplan.sqlite
    volumes:
      - archplan-data:/var/lib/archplan
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  archplan-data:
